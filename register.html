
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Student Hub Career</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f7ee, #f8fcf9, #d8f0e1);
            color: #193528;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            text-decoration: none;
        }

        .navbar {
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-bottom: 1px solid #e0eae3;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #193528;
        }

        .logo span {
            color: #16834a;
        }

        .home-link {
            color: #16834a;
            font-size: 14px;
            font-weight: bold;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px 20px;
        }

        .register-card {
            width: 100%;
            max-width: 500px;
            padding: 35px;
            background: white;
            border: 1px solid #e0eae3;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(20, 75, 43, 0.09);
        }

        .icon {
            width: 55px;
            height: 55px;
            display: grid;
            place-items: center;
            background: #e8f7ee;
            border-radius: 15px;
            font-size: 27px;
            margin-bottom: 18px;
        }

        .eyebrow {
            color: #16834a;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 29px;
            margin-bottom: 8px;
        }

        .description {
            color: #6b7d73;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dce8df;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            background: #fcfefc;
        }

        input:focus,
        select:focus {
            border-color: #16834a;
            box-shadow: 0 0 0 3px #16834a18;
        }

        .password-hint {
            display: block;
            margin-top: 6px;
            color: #6b7d73;
            font-size: 11px;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            margin: 20px 0;
            font-size: 12px;
            color: #586b60;
            font-weight: normal;
        }

        .terms input {
            width: auto;
            margin-top: 3px;
        }

        .terms a,
        .login-link a {
            color: #16834a;
            font-weight: bold;
        }

        .register-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #16834a;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-button:hover {
            background: #0c6034;
        }

        .register-button:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .message.error {
            display: block;
            background: #fff0f0;
            color: #a52b2b;
        }

        .message.success {
            display: block;
            background: #e8f7ee;
            color: #126a3a;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #6b7d73;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #6b7d73;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 25px 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<header class="navbar">
    <a href="index.html" class="logo">Student<span>Hub</span></a>
    <a href="index.html" class="home-link">← Back to Home</a>
</header>

<main>
    <section class="register-card">
        <div class="icon">🎓</div>

        <p class="eyebrow">JOIN STUDENT HUB</p>
        <h1>Create Your Account</h1>
        <p class="description">
            Register to explore internships and start your career journey.
        </p>

        <form id="registerForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    minlength="2"
                    maxlength="100"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    maxlength="150"
                    required
                >
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create password"
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="72"
                        required
                    >
                    <small class="password-hint">
                        At least 8 characters
                    </small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Repeat password"
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="72"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="education">Current Education</label>
                <select id="education" name="education" required>
                    <option value="">Select your education</option>
                    <option value="FY">First Year</option>
                    <option value="SY">Second Year</option>
                    <option value="TY">Third Year</option>
                    <option value="Graduate">Graduate</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <label class="terms">
                <input type="checkbox" id="terms" required>
                <span>
                    I confirm that the information provided is accurate and
                    agree to use this student portal responsibly.
                </span>
            </label>

            <button type="submit" class="register-button" id="registerButton">
                Create Account
            </button>

            <div id="message" class="message" role="status"></div>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="login.html">Login here</a>
        </p>
    </section>
</main>

<footer>
    © 2026 Student Hub Career. All rights reserved.
</footer>

<script>
    const registerForm = document.getElementById("registerForm");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const registerButton = document.getElementById("registerButton");
    const message = document.getElementById("message");

    registerForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        message.className = "message";
        message.textContent = "";

        if (passwordInput.value !== confirmPasswordInput.value) {
            message.className = "message error";
            message.textContent = "Passwords do not match.";
            confirmPasswordInput.focus();
            return;
        }

        registerButton.disabled = true;
        registerButton.textContent = "Creating Account...";

        try {
            const response = await fetch("/api/auth/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: document.getElementById("name").value.trim(),
                    email: document.getElementById("email").value.trim(),
                    password: passwordInput.value,
                    education: document.getElementById("education").value
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || "Registration failed.");
            }

            message.className = "message success";
            message.textContent =
                data.message || "Account created successfully!";

            registerForm.reset();

            setTimeout(function() {
                window.location.href = "login.html";
            }, 1200);

        } catch (error) {
            message.className = "message error";
            message.textContent =
                error.message === "Failed to fetch"
                    ? "Cannot connect to the server. Start your Node.js server and try again."
                    : error.message;
        } finally {
            registerButton.disabled = false;
            registerButton.textContent = "Create Account";
        }
    });
</script>

</body>
</html>
